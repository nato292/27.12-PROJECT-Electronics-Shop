<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Electronics Shop{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<header class="navbar">
    <div class="nav-container">
        <div class="logo">
            <a href="{% url 'product_list' %}">🌎 Global Electronics</a>
        </div>

        <nav class="nav-links">
            <a href="{% url 'product_list' %}">Каталог</a>
            <a href="{% url 'cart' %}">Кошик</a>

            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Профіль</a>
                <a href="{% url 'my_orders' %}">Замовлення</a>
                <a href="{% url 'logout' %}" class="nav-btn">Вийти</a>
            {% else %}
                <a href="{% url 'login' %}">Увійти</a>
                <a href="{% url 'register' %}" class="nav-btn">Реєстрація</a>
            {% endif %}
        </nav>
    </div>
</header>

<main>
    {% block content %}{% endblock %}
</main>

<footer>
    © 2026 Global Electronics. Designed in Apple Style.
</footer>

</body>
</html>
